# Cloudflare Workers (workers-rs, wasm32-unknown-unknown). 루트 작업 공간(데스크톱 앱)과 따로 빌드한다:
# 표적이 wasm 이고, 앱의 rustflags(target-cpu=native) · candle 패치를 받으면 안 된다.
#
#   (공용)   premium-discount-worker-common 을 git 리비전으로 가져와 `logis-worker-common` 이라는 이름으로 쓴다(아래 [workspace.dependencies]):
#            JS 값 모형(V) · D1 · Workers AI · Vectorize · fetch · gzip(pako) · aws4fetch · ethers. 예전 workers/common 이 PD 로 옮겨 갔다
#   logis-tables  logis-worker-tables: logis 에만 쓰는 원본 표(지역 · 언어) · 망가진 JSON 고치기
#   proxy    proxy-commerce-logis-center (fetch): 작업 하나를 받아 추출 · 저장 · 검색
#   apac     commerce-apac-logis-center (cron): tasks 대기열을 돌며 proxy 를 부른다
#
# 원본 TypeScript 와 같은 동작이 목표다(같은 SQL · 같은 프롬프트 · 같은 JSON 출력). 차이는 docs/workers-rs.md 에 적는다.
[workspace]
resolver = "2"
members = ["logis-tables", "proxy", "apac", "commerce", "trading"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Qntology/logis-center"

[workspace.dependencies]
worker = { version = "=0.8.7", features = ["d1"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = "2"
ryu-js = "1"
flate2 = "1"
regex = "1"
fancy-regex = "0.18"
scraper = "0.25"
# aws4fetch(S3 SigV4) · ethers 주소 — 순수 Rust (wasm 에서도 그대로). 판은 premium-discount-identity 가 잠근 것과 같다
hmac = "0.12"
sha2 = "0.10"
k256 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdsa"] }
tiny-keccak = { version = "2", features = ["keccak"] }
getrandom = "0.3"
url = "2"
# 공용 층은 premium-discount 의 것 (루트 Cargo.toml 의 premium-discount-* 와 같은 저장소 · 같은 꼴: 전체 SHA 로 고정).
# 이름을 logis-worker-common 으로 붙여 `use logis_worker_common::…` 은 그대로다. 올릴 때는 rev 를 바꾸고 `cargo update -p premium-discount-worker-common`.
# 엔터티 해시 util::hash_str 는 logis-schema 의 hash_id 와 같은 코드다(premium-discount-identity + 다시 해시).
# 로컬 ../premium-discount 로 같이 고칠 때는 아래 [patch."https://github.com/Qntology/premium-discount"] 의 주석을 푼다.
logis-worker-common = { package = "premium-discount-worker-common", git = "https://github.com/Qntology/premium-discount", rev = "60c3614667f1229a1de834a223a8e4842a663600" }
logis-worker-tables = { path = "logis-tables" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

# [patch."https://github.com/Qntology/premium-discount"]
# premium-discount-worker-common = { path = "../../premium-discount/workers/common" }
